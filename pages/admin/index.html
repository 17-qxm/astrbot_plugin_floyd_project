<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Floyd 管理面板</title>
    <link rel="stylesheet" href="./style.css" />
    <!-- importmap：把 "vue" 映射到 CDN ESM 构建。组件统一 from "./vue.js" 再 re-export。 -->
    <script type="importmap">
      {
        "imports": {
          "vue": "https://unpkg.com/vue@3.4.38/dist/vue.esm-browser.prod.js"
        }
      }
    </script>
    <!-- dev-mock 无条件加载，内部自检 ?dev=1（非 dev 模式立即 return，零影响）。带版本号绕缓存。 -->
    <script src="./dev-mock.js?v=2"></script>
  </head>
  <body>
    <div id="floyd-app"></div>
    <!-- app.js 等 #floyd-app 存在后再加载；defer 保证 DOM 就绪 -->
    <script type="module" src="./app.js"></script>
  </body>
</html>
